# Quidra Video package metadata - the single source of truth.
# Regenerate quidra.package with Core's `quidra package sync .`; Core owns the
# accepted metadata grammar and compatibility-manifest generation.
[package]
name = "quidra-video"
import = "video"
display_name = "Quidra Video"
version = "0.5.0"
repository = "https://github.com/quidra-lang/video"

[requires]
quidra = ">=0.5.0 <0.6.0"
abi = 1
math = ">=0.5.0 <0.6.0"

[native.source]
ffmpeg = "native/video_native.cpp"

[native.pkg]
avformat = "libavformat"
avcodec = "libavcodec"
avutil = "libavutil"
swscale = "libswscale"
